version: '3.8'

services:
  bankmanagementsystem:
    image: bankmanagementsystem:latest
    container_name: bankmanagementsystem
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DOTNET_ENVIRONMENT=Production
      - HEALTH_CHECK_PORT=8080
      - TZ=UTC
      # Database connection - configure based on your external database
      - ConnectionStrings__OpenBankLocal=Data Source=${DB_HOST:-localhost};Initial Catalog=${DB_NAME:-OpenBankLocal};User ID=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True
    networks:
      - app-network
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge

volumes:
  logs:
  config:
